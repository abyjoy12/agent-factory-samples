name: Check contribution origin

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to recheck
        required: true
        type: number

permissions:
  contents: read
  statuses: write

jobs:
  evaluate-fork-origin:
    runs-on: ubuntu-latest
    steps:
      # Use the trusted base workflow and metadata only. Never check out PR code.
      # pull_request_target runs on the base SHA, so explicitly status the PR head.
      - name: Check fork source or administrator exemption
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request || (await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(context.payload.inputs.pull_request_number),
            })).data;
            let state = 'failure';
            let description = 'Contributors must open pull requests from a fork.';
            try {
              if (pr.head.repo && pr.head.repo.id !== pr.base.repo.id) {
                state = 'success';
                description = 'Contribution comes from a fork.';
              } else if (pr.head.repo) {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username: pr.user.login,
                });
                if (data.permission === 'admin') {
                  state = 'success';
                  description = 'Repository administrator is exempt from the fork requirement.';
                }
              }
            } catch (error) {
              state = 'error';
              description = 'Could not verify contributor permissions.';
              core.error(error.message);
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'fork-origin',
              state,
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (state !== 'success') {
              core.setFailed(description);
            }
