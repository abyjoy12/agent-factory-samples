name: Validate contributions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install utility dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Test contribution origin policy
        run: node --test tests/test_contribution_origin.cjs
      - name: Check READMEs, catalog inputs, and tracked Pages
        run: python scripts/publication_guard.py
      - name: Generate and check the exact Pages output
        env:
          AGENT_SAMPLES_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          AGENT_SAMPLES_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/latest
        run: |
          python scripts/generate_docs.py
          python scripts/publication_guard.py --pages docs
      - name: Build and round-trip validate disposable archives
        run: |
          python - <<'PY'
          import os
          import secrets
          import subprocess
          import sys

          environment = dict(os.environ, PAF_ARCHIVE_PASSWORD=secrets.token_urlsafe(32))
          subprocess.run([sys.executable, "scripts/build_release.py"], env=environment, check=True)
          PY
